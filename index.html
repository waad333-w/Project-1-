<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
  <title>find it!</title>
</head>

<body>

  <h1>find it!</h1>

  <h2 id="message">Find the objects Zozi wants!🔎</h2>

  <h3 id="timer">Time⏳: 10</h3>

  <button id="startGame">start Game!</button>

  <div class="game">

  <div class="zozi">
    <img src="images/zozi.png" alt="zozi the cat">
  </div>


  <img id="gift" class="object" src="images/gift.png" alt="gift">
  <img id="bee"class="object" src="images/bee.png" alt="bee">
  <img id="camera"class="object" src="images/camera.png" alt="camera">
  <img id="cookies"class="object" src="images/cookies.png" alt="cookies">
  <img id="cherry"class="object" src="images/cherry.png" alt="cherry">
  <img id="blueCap"class="object" src="images/blueCap.png" alt="blueCap">
  <img id="blueFish"class="object" src="images/blueFish.png" alt="blueFish">
  <img id="boba"class="object" src="images/boba.png" alt="boba">
  <img id="cupCake"class="object" src="images/cupCake.png" alt="cupCake">
  <img id="duck"class="object" src="images/duck.png" alt="duck">
  <img id="glasses"class="object" src="images/glasses.png" alt="glasses">
  <img id="book"class="object" src="images/book.png" alt="book">
  <img id="goldenFish"class="object" src="images/goldenFish.png" alt="goldenFish">
  <img id="pinkHat"class="object" src="images/pinkHat.png" alt="pinkHat">
  <img id="iceCream"class="object" src="images/iceCream.png" alt="iceCream">
  <img id="mouse"class="object" src="images/mouse.png" alt="mouse">
  <img id="sunFlower"class="object" src="images/sunFlower.png" alt="sunFlower">
  <img id="star"class="object" src="images/star.png" alt="star">
  <img id="strawBerryMilk"class="object" src="images/strawBerryMilk.png" alt="strawBerryMilk">

  </div> 
  
<button id="playAgain">play again!🎮</button>

</body>
</html>
